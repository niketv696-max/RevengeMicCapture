name: Publish Revenge Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dist
        run: |
          mkdir -p dist/mic-diagnostic
          cp plugins/mic-diagnostic/index.js dist/mic-diagnostic/index.js
          cp plugins/mic-diagnostic/manifest.json dist/mic-diagnostic/manifest.json

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
